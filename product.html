<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ROG PRODUCT.KG</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:40px;
}

.container{
display:flex;
align-items:flex-start;
justify-content:center;
gap:50px;
}

.left{
flex:1;
max-width:550px;
}

.left img{
width:100%;
max-width:500px;
height:auto;
}

.right{
flex:1;
max-width:1300px;
}

.price{
  font-size:28px;
  color:red;
  margin:15px 0;
}

.specs{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}

.specs p{
  margin:10px 0;
}

/* описание снизу */
.desc{
  margin-top:30px;
  max-width:900px;
  opacity:0.9;
}

/* кнопка */
button{
  margin-top:20px;
  padding:12px 25px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:darkred;
}

/* адаптив */
@media(max-width:900px){
  .container{
    flex-direction:column;
  }
}
</style>

</head>

<body>

<h1 id="title"></h1>

<div class="container">

  <!-- ЛЕВО -->
  <div class="left">

  </div>

  <div class="right">

<a href="asus_rog.html">

</div>

<div class="desc">

</div>

</html>
